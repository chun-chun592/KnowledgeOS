[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgeos"
version = "0.1.4"
description = "Markdown-native knowledge workflows for humans and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "PyYAML==6.0.4"]

[project.optional-dependencies]
strict = ["pywin32>=306; sys_platform == 'win32'"]
test = ["pytest>=8"]

[project.scripts]
knowledgeos = "knowledgeos.cli:main"
knowledgeos-mcp = "server:main"

[tool.setuptools]
packages = ["knowledgeos"]
package-dir = { knowledgeos = "src/knowledgeos" }
py-modules = ["server", "markdown_native", "release_paths", "write_client", "write_transport", "secure_write", "windows_peer", "human_authorization", "ledger_admission", "projection_recovery"]

[tool.setuptools.package-data]
knowledgeos = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
